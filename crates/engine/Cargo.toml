[package]
name = "keyrift-engine"
description = "Keyrift daemon: device grabbing, uinput output, hot-plug, IPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
keyrift-core.workspace = true
keyrift-config.workspace = true
evdev = { version = "0.13", features = ["tokio"] }
tokio = { version = "1.54.1", features = [
  "rt",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
  "io-util",
] }
inotify = { version = "0.11.5", features = ["stream"] }
tracing = "0.1.44"
serde_json = "1.0.154"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
