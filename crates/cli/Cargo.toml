[package]
name = "keyrift"
description = "Keyrift CLI and daemon entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyrift-config.workspace = true
keyrift-core.workspace = true
keyrift-engine.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints]
workspace = true

[[bin]]
name = "keyrift"
path = "src/main.rs"

[dev-dependencies]
evdev = "0.13"
libc = "0.2"
tempfile = "3.27.0"
